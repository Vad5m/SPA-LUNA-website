<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, user-scalable=yes"
        />
        <title>Абонементы | Салон красоты</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;600;700&family=Manrope:wght@200;300;400;500;600;700;800&display=swap"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        />
        <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
        <link rel="stylesheet" href="/static/css/sert.css" />
    </head>
    <body>
        <div class="stars" id="stars"></div>
        <div class="floating-elements" id="floatingElements"></div>

        <div class="container">
            <div class="left-column">
                <div class="buttons-container" id="mainButtons">
                    <button class="btn" id="buyCertBtn">
                        <i class="fas fa-shopping-cart"></i> Купить сертификат
                    </button>
                    <button class="btn" id="subscriptionsBtn">
                        <i class="fas fa-ticket-alt"></i> Абонименты
                    </button>
                </div>
                <div class="certificate-panel" id="certificatePanel">
                    <h2><i class="fas fa-qrcode"></i> Сертификат</h2>
                    <div class="qr-image-container">
                        <img
                            src="/static/serteficatQR.png"
                            alt="QR-код"
                            id="qrImg"
                        />
                    </div>
                    <a
                        href="https://payment.alfabank.ru/sc/BCcvnmaaZAyRCbdQ"
                        class="btn mobile-link-btn"
                        id="mobilePayLink"
                        target="_blank"
                        rel="noopener noreferrer"
                        ><i class="fas fa-mobile-alt"></i> Перейти к оплате</a
                    >
                    <button
                        class="btn back-from-certificate"
                        id="backFromCertBtn"
                    >
                        <i class="fas fa-arrow-left"></i> Назад
                    </button>
                </div>
                <div class="subscriptions-panel" id="subscriptionsPanel">
                    <h2><i class="fas fa-calendar-alt"></i> Наши абонементы</h2>
                    <div
                        class="subscriptions-grid"
                        id="subscriptionsGrid"
                    ></div>
                    <button
                        class="btn back-from-subscriptions"
                        id="backFromSubBtn"
                        style="margin-top: 25px"
                    >
                        <i class="fas fa-arrow-left"></i> Назад
                    </button>
                </div>
            </div>
            <div class="right-column">
                <div class="moon-container"><div class="moon"></div></div>
            </div>
        </div>

        <div id="subscriptionModal" class="modal-overlay">
            <div class="modal-window" id="modalWindow">
                <span class="close-modal-icon" id="closeModalCross"
                    ><i class="fas fa-times-circle"></i
                ></span>
                <div
                    class="modal-video-container"
                    id="modalVideoContainer"
                ></div>
                <div class="modal-info">
                    <div class="modal-title" id="modalTitle">Абонемент</div>
                    <div class="modal-visits" id="modalVisits">0 посещений</div>
                    <div class="modal-desc" id="modalDesc">Описание услуги</div>
                    <div class="modal-price-block">
                        <span class="modal-price-current" id="modalPrice"
                            >0 ₽</span
                        >
                        <span class="modal-price-old" id="modalOldPrice"
                            >0 ₽</span
                        >
                    </div>
                    <div id="paymentMethodContainer"></div>
                </div>
            </div>
        </div>

        <script src="/static/js/sert.js"></script>
    </body>
</html>
