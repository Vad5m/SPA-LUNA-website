<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Страница не найдена | СПА-салон Luna</title>
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;600;700&amp;family=Manrope:wght@200;300;400;500;600;700;800"
            type="text/css"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        />
        <link rel="stylesheet" href="/static/css/404.css" />
    </head>
    <body>
        <!-- Контейнер для музыкального плеера (изначально скрыт) -->
        <div id="music-player-container"></div>

        <div class="stars" id="stars"></div>
        <div class="floating-elements" id="floatingElements"></div>

        <!-- Контейнер для погоды (изначально скрыт) -->
        <div id="weather-container"></div>

        <!-- Оригинальное содержимое страницы 404 -->
        <div class="error-container">
            <div class="moon-container">
                <div class="moon">
                    <div class="moon-craters">
                        <div class="crater crater-1"></div>
                        <div class="crater crater-2"></div>
                        <div class="crater crater-3"></div>
                        <div class="crater crater-4"></div>
                        <div class="crater crater-5"></div>
                    </div>
                </div>
            </div>

            <div class="error-number">404</div>
            <h1 class="error-title">Страница не найдена</h1>
            <p class="error-description">
                К сожалению, запрашиваемая вами страница не существует.
                Возможно, она была перемещена или удалена. Мы приглашаем вас
                вернуться на главную страницу нашего СПА-салона.
            </p>
            <a href="/" class="home-button">
                <i class="fas fa-home"></i>
                Вернуться на главную
            </a>
        </div>

        <script src="/static/js/404.js"></script>
    </body>
</html>
