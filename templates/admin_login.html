<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>СПА-салон Luna | Администратор</title>
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;600;700&amp;family=Manrope:wght@200;300;400;500;600;700;800"
            type="text/css"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        />
        <link rel="stylesheet" href="/static/css/admin_login.css" />
    </head>

    <body>
        <div class="stars" id="stars"></div>
        <div class="floating-elements" id="floatingElements"></div>

        <div class="login-container">
            <div class="login-card">
                <div class="logo">
                    <img
                        src="https://via.placeholder.com/80/ffffff/000000?text=SPA"
                        alt="SPA Luna"
                        class="logo-img"
                    />
                    <h1>Панель администратора</h1>
                    <p>СПА-салон Luna</p>
                </div>

                {% if error %}
                <div class="error-message show" id="errorMessage">
                    {{ error }}
                </div>
                {% else %}
                <div class="error-message" id="errorMessage">
                    Неверный логин или пароль. Попробуйте еще раз.
                </div>
                {% endif %}

                <form id="loginForm" method="POST" action="/admin/login/">
                    <div class="form-group">
                        <label for="username">Логин</label>
                        <div class="input-with-icon">
                            <i class="fas fa-user"></i>
                            <input
                                type="text"
                                id="username"
                                name="username"
                                class="form-control"
                                placeholder="Введите ваш логин"
                                required
                            />
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">Пароль</label>
                        <div class="input-with-icon">
                            <i class="fas fa-lock"></i>
                            <input
                                type="password"
                                id="password"
                                name="password"
                                class="form-control"
                                placeholder="Введите ваш пароль"
                                required
                            />
                            <button
                                type="button"
                                class="password-toggle"
                                id="togglePassword"
                            >
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn-login">
                        <i class="fas fa-sign-in-alt"></i> Войти в систему
                    </button>
                </form>

                <div class="back-home">
                    <a href="/">
                        <i class="fas fa-arrow-left"></i> Вернуться на главную
                    </a>
                </div>
            </div>
        </div>

        <script src="/static/js/admin_login.js"></script>
    </body>
</html>
